# ============================================================
# ChatSphere Application Configuration
# ============================================================

# Server
server.port=8080

# ── MySQL ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/chatsphere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ────────────────────────────────────────────────────
# Must be >= 256 bits (32 chars) for HS256
jwt.secret=ChatSphere-SuperSecret-Key-2024-MustBe256BitsLong!
jwt.expiration=86400000

# ── Logging ────────────────────────────────────────────────
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.com.chatsphere=DEBUG
