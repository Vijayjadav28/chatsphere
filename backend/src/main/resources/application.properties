# ============================================================
# ChatSphere Application Configuration
# ============================================================
# Railway environment variables take priority.
# Fallback values are for local development only.
# ============================================================

# ── Server ─────────────────────────────────────────────────
# Railway injects PORT automatically
server.port=${PORT:8080}

# ── MySQL ──────────────────────────────────────────────────
# Railway sets SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD automatically
# when you link a MySQL service to the backend in Railway dashboard.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chatsphere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (important for Railway — prevents timeout drops)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ────────────────────────────────────────────────────
# Override JWT_SECRET on Railway with a strong secret via env var
jwt.secret=${JWT_SECRET:ChatSphere-SuperSecret-Key-2024-MustBe256BitsLong!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ───────────────────────────────────────────────────
# Set FRONTEND_URL env var in Railway to your Vercel/Railway frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ── Logging ────────────────────────────────────────────────
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.com.chatsphere=INFO

# ── Actuator (Railway health check) ────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

